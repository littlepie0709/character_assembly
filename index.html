<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>汉字拼拼乐 · Character Assembly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FF; --card:#FFFFFF; --ink:#2B3A55; --muted:#8793AD;
  --pink:#FF8FAB; --pink-d:#E86A8B; --mint:#6FD6B0; --mint-soft:#DDF6EC; --yellow:#FFD66B;
  --edge:#DCE4F4; --edge-d:#C5D2EC; --grid:#FFC2CF; --bun:#FFF4E8; --bun-line:#E9C9A8;
  --glyph:"Ma Shan Zheng","KaiTi","STKaiti","楷体",serif;
  --cute:"ZCOOL KuaiLe","Microsoft YaHei",sans-serif;
  --ui:"Nunito","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E2233; --card:#2A3047; --ink:#EEF1FF; --muted:#9AA3C0; --mint-soft:#27463F;
  --edge:#3A4262; --edge-d:#1A1E2E; --grid:#6B4056; --bun:#F3E6D6; --bun-line:#C9A27E;}}
:root[data-theme="dark"]{
  --bg:#1E2233; --card:#2A3047; --ink:#EEF1FF; --muted:#9AA3C0; --mint-soft:#27463F;
  --edge:#3A4262; --edge-d:#1A1E2E; --grid:#6B4056; --bun:#F3E6D6; --bun-line:#C9A27E;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.en{color:var(--muted);font-family:var(--ui);font-weight:600;font-size:.8em}

.wrap{max-width:960px;margin:0 auto;padding:14px 18px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--cute);font-weight:400;font-size:2rem;margin:0;color:var(--pink-d)}
.pills{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border-radius:999px;padding:5px 14px;font-weight:900;font-size:1.05rem;box-shadow:0 3px 0 var(--edge)}
.pill.btnlike{border:none;font-weight:800;font-size:.9rem}

.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 3px 0 var(--edge);margin-bottom:12px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:999px;padding:7px 16px;font-family:var(--cute);font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.seg button[aria-pressed="true"] .en{color:#fff;opacity:.85}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--edge)}
.dots i.now{background:var(--yellow);transform:scale(1.25)}
.dots i.done{background:var(--mint)} .dots i.miss{background:var(--pink)}

.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:1fr;gap:16px}}

.board{--g:min(78vw,340px);width:var(--g);height:var(--g);position:relative;margin:0 auto;
  background:var(--card);border-radius:28px;box-shadow:0 6px 0 var(--edge);transition:box-shadow .3s}
svg.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slot{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;
  border:3px dashed transparent;border-radius:18px;transition:background .2s,border-color .2s}
.slot.empty{border-color:var(--mint)}
.slot.next{background:var(--mint-soft)}
.slot.drop{border-style:solid;border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 25%,transparent)}
.glyph{font-family:var(--glyph);font-size:calc(var(--g)*.72);line-height:1;display:block}
.ph{font-family:var(--cute);font-size:1.3rem;color:var(--mint);text-align:center;line-height:1.1}
.ph .en{display:block;font-size:.6em;color:var(--mint)}
.lr .s0{left:7%;top:7%;width:42%;height:86%} .lr .s1{right:7%;top:7%;width:42%;height:86%}
.lr .glyph{transform:scaleX(.55)}
.tb .s0{left:7%;top:7%;width:86%;height:42%} .tb .s1{left:7%;bottom:7%;width:86%;height:42%}
.tb .glyph{transform:scaleY(.55)}
.wl .s0{inset:7%} .wl .s1{right:8%;top:7%;width:60%;height:60%;z-index:2}
.wl .s1 .glyph{font-size:calc(var(--g)*.44)}
.fs .s0{inset:7%} .fs .s1{left:27%;top:27%;width:46%;height:46%;z-index:2}
.fs .s1 .glyph{font-size:calc(var(--g)*.34)}
.wl .s0.empty .ph,.fs .s0.empty .ph{position:absolute;left:10%;bottom:9%}
.full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--glyph);font-size:calc(var(--g)*.74);line-height:1;opacity:0;transform:scale(.8);
  transition:opacity .4s,transform .5s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.board.solved{box-shadow:0 6px 0 var(--mint),0 0 0 4px var(--mint)}
.board.solved .slot{opacity:0;transition:opacity .25s}
.board.solved .full{opacity:1;transform:scale(1)}

.wordrow{display:flex;gap:12px;justify-content:center}
.wordrow .cell{--g:min(27vw,140px);width:var(--g);height:var(--g);position:relative;
  background:var(--card);border-radius:22px;box-shadow:0 5px 0 var(--edge);transition:box-shadow .3s}
.wordrow .slot{inset:8%}
.wordrow .glyph{font-size:calc(var(--g)*.7)}
.wordrow.solved .cell{box-shadow:0 5px 0 var(--mint),0 0 0 4px var(--mint)}

.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* prompt + mascot */
.prompt{background:var(--card);border-radius:24px;padding:16px 20px;box-shadow:0 5px 0 var(--edge)}
.pinyin{font-size:clamp(2rem,6vw,2.8rem);font-weight:900;color:var(--pink-d);line-height:1.1;min-height:1.1em}
.meaning{font-size:1.25rem;font-weight:800;margin-top:4px}
.struct{color:var(--muted);font-size:.9rem;font-weight:700;min-height:1.3em;margin-top:4px}
.talk{display:flex;align-items:flex-end;gap:10px;margin:14px 0 6px}
.bun{width:74px;height:66px;flex:none;overflow:visible}
.bun .body{fill:var(--bun);stroke:var(--bun-line);stroke-width:2.5}
.bun .fold{fill:none;stroke:var(--bun-line);stroke-width:2.5;stroke-linecap:round}
.bun .eyes{fill:#2B3A55} .bun .blush{fill:#FFB3C4}
.bun .mouth,.bun .happyeyes{fill:none;stroke:#2B3A55;stroke-width:3;stroke-linecap:round}
.bun .omouth{fill:#2B3A55} .bun .happyeyes,.bun .omouth{display:none}
.bun.happy .eyes{display:none}.bun.happy .happyeyes{display:inline}
.bun.happy{animation:hop .6s}
.bun.sad .mouth{display:none}.bun.sad .omouth{display:inline}
.bun.sad{animation:wobble .4s}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.bubble{position:relative;background:var(--card);border-radius:18px;padding:10px 14px;font-family:var(--cute);
  font-size:1.15rem;box-shadow:0 4px 0 var(--edge);flex:1;min-height:3.2em}
.bubble::before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.bubble .en{display:block;font-size:.75rem;margin-top:2px}
.bubble.good{color:#1F9A70} .bubble.bad{color:var(--pink-d)}

.tray{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.tile{width:72px;height:72px;border-radius:20px;border:none;background:var(--card);
  box-shadow:0 5px 0 var(--edge-d);font-family:var(--glyph);font-size:2.8rem;line-height:1;
  display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;transition:transform .08s,box-shadow .08s}
.tile:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--edge-d)}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge-d)}
.tile.used{visibility:hidden}
.tile.hint{background:var(--yellow);color:#2B3A55;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:16px;padding:8px 14px;font-family:var(--cute);font-size:1.05rem;
  background:var(--card);box-shadow:0 4px 0 var(--edge-d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge-d)}
.btn .en{margin-left:4px}
.btn.primary{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.btn.primary .en{color:#fff;opacity:.85}
.btn[hidden]{display:none}

.bit{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:20;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.full{transition:none}}

.end{text-align:center;padding:24px 0}
.end .bun{width:120px;height:108px}
.end .big{font-family:var(--cute);font-size:3.6rem;color:var(--pink-d);line-height:1.1;margin-top:8px}
.review{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 26px}
.review div{background:var(--card);border-radius:16px;padding:8px 14px;text-align:left;box-shadow:0 4px 0 var(--edge);font-weight:700}
.review .c{font-family:var(--glyph);font-size:2rem;margin-right:8px;font-weight:400}

dialog{border:none;border-radius:24px;padding:22px;width:min(680px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(30,34,51,.45)}
dialog h2{margin:0 0 6px;font-family:var(--cute);font-weight:400;font-size:1.4rem}
dialog p{margin:0 0 8px;color:var(--muted);font-size:.88rem}
dialog code{background:var(--mint-soft);padding:1px 6px;border-radius:6px;color:var(--ink)}
textarea{width:100%;min-height:250px;font-family:var(--ui);font-size:.98rem;padding:12px;border-radius:16px;border:2px solid var(--edge);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row label{font-size:.9rem;font-weight:700;display:flex;gap:6px;align-items:center}
select{font:inherit;padding:4px 8px;border-radius:10px;border:2px solid var(--edge);background:var(--bg);color:var(--ink)}
.err{color:var(--pink-d);font-size:.9rem;font-weight:700;min-height:1.3em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>汉字拼拼乐</h1>
    <div class="pills">
      <span class="pill" title="Points">⭐ <b id="score">0</b></span>
      <span class="pill" title="Streak">🔥 <b id="streak">0</b></span>
      <span class="pill" title="Round"><b id="round">1/10</b></span>
      <button class="pill btnlike" id="editBtn">✏️ 编辑 <span class="en">Edit</span></button>
    </div>
  </header>

  <div class="seg" role="group" aria-label="Mode">
    <button class="modebtn" data-mode="char" aria-pressed="true">拼字 <span class="en">Characters</span></button>
    <button class="modebtn" data-mode="word" aria-pressed="false">组词 <span class="en">Words</span></button>
    <button class="modebtn" data-mode="mix" aria-pressed="false">混合 <span class="en">Mixed</span></button>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <main id="game" class="stage">
    <div id="boardHost"></div>
    <div>
      <div class="prompt">
        <div class="pinyin" id="pinyin"></div>
        <div class="meaning" id="meaning"></div>
        <div class="struct" id="struct"></div>
      </div>
      <div class="talk">
        <svg class="bun" id="bun" viewBox="0 0 100 90" aria-hidden="true"><path class="body" d="M50 8c8 0 10 6 14 8 10-2 20 6 22 16 10 6 12 22 4 34-6 10-22 16-40 16S16 76 10 66C2 54 4 38 14 32c2-10 12-18 22-16 4-2 6-8 14-8z"/><path class="fold" d="M40 20q10 8 20 0M44 14q6 5 12 0"/><g class="eyes"><ellipse cx="37" cy="50" rx="4" ry="5"/><ellipse cx="63" cy="50" rx="4" ry="5"/></g><path class="happyeyes" d="M32 51q5-7 10 0M58 51q5-7 10 0"/><ellipse class="blush" cx="27" cy="60" rx="6" ry="3.5"/><ellipse class="blush" cx="73" cy="60" rx="6" ry="3.5"/><path class="mouth" d="M45 60q5 5 10 0"/><ellipse class="omouth" cx="50" cy="63" rx="3.5" ry="4"/></svg>
        <div class="bubble" id="msg" aria-live="polite"></div>
      </div>
      <div class="tray" id="tray"></div>
      <div class="actions">
        <button class="btn" id="hintBtn">💡 提示<span class="en">Hint</span></button>
        <button class="btn" id="clearBtn">↺ 清空<span class="en">Clear</span></button>
        <button class="btn" id="skipBtn">⏭ 跳过<span class="en">Skip</span></button>
        <button class="btn" id="sayBtn">🔊<span class="en">Listen</span></button>
        <button class="btn primary" id="nextBtn" hidden>下一题<span class="en">Next</span></button>
      </div>
    </div>
  </main>

  <section id="endScreen" class="end" hidden>
    <svg class="bun" id="endBun" viewBox="0 0 100 90" aria-hidden="true"><path class="body" d="M50 8c8 0 10 6 14 8 10-2 20 6 22 16 10 6 12 22 4 34-6 10-22 16-40 16S16 76 10 66C2 54 4 38 14 32c2-10 12-18 22-16 4-2 6-8 14-8z"/><path class="fold" d="M40 20q10 8 20 0M44 14q6 5 12 0"/><g class="eyes"><ellipse cx="37" cy="50" rx="4" ry="5"/><ellipse cx="63" cy="50" rx="4" ry="5"/></g><path class="happyeyes" d="M32 51q5-7 10 0M58 51q5-7 10 0"/><ellipse class="blush" cx="27" cy="60" rx="6" ry="3.5"/><ellipse class="blush" cx="73" cy="60" rx="6" ry="3.5"/><path class="mouth" d="M45 60q5 5 10 0"/><ellipse class="omouth" cx="50" cy="63" rx="3.5" ry="4"/></svg>
    <div class="big" id="endScore"></div>
    <p id="endText"></p>
    <div class="review" id="review"></div>
    <button class="btn primary" id="againBtn">再玩一次<span class="en">Play again</span></button>
  </section>
</div>
<dialog id="editor">
  <h2>编辑字表 <span class="en">Edit the list</span></h2>
  <p><b>拼字 Characters：</b><code>字 = 部件?部件 | 拼音 | English</code>　
    <code>+</code> 左右 left–right　<code>/</code> 上下 top–bottom　<code>&lt;</code> 辶包围 wrap (过)　<code>@</code> 全包围 enclosed (国)</p>
  <p><b>组词 Words：</b><code>词 | 拼音 | English</code>（2–4 个字 characters）</p>
  <textarea id="listText" spellcheck="false"></textarea>
  <div class="err" id="err"></div>
  <div class="row">
    <label>每局题数 Rounds <select id="roundsSel"><option>5</option><option selected>10</option><option>15</option><option>20</option><option value="0">全部 All</option></select></label>
    <label><input type="checkbox" id="pyChk" checked> 显示拼音 Show pinyin</label>
    <label><input type="checkbox" id="speakChk" checked> 答对朗读 Read aloud</label>
  </div>
  <div class="row">
    <span style="flex:1"></span>
    <button class="btn" id="resetList">恢复默认<span class="en">Reset</span></button>
    <button class="btn" id="cancelEdit">取消<span class="en">Cancel</span></button>
    <button class="btn primary" id="saveList">保存并开始<span class="en">Save &amp; start</span></button>
  </div>
</dialog>
<script>
const DEFAULT_LIST = `# 拼字 Characters
过 = 辶<寸 | guò | to pass; (have done)
还 = 辶<不 | hái | still; also
国 = 囗@玉 | guó | country
家 = 宀/豕 | jiā | home; family
英 = 艹/央 | yīng | English; brave
法 = 氵+去 | fǎ | France; law
会 = 人/云 | huì | can; be able to
说 = 讠+兑 | shuō | to speak
语 = 讠+吾 | yǔ | language
汉 = 氵+又 | hàn | Chinese (Han)
点 = 占/灬 | diǎn | a little; dot
的 = 白+勺 | de | (possessive particle)
数 = 娄+攵 | shù | number
体 = 亻+本 | tǐ | body
音 = 立/日 | yīn | sound

# 组词 Words
去过 | qù guo | have been to
国家 | guójiā | country
英国 | Yīngguó | the UK
法国 | Fǎguó | France
日本 | Rìběn | Japan
英语 | Yīngyǔ | English (language)
日语 | Rìyǔ | Japanese (language)
语言 | yǔyán | language
汉语 | Hànyǔ | Chinese (language)
一点儿 | yìdiǎnr | a little
有的 | yǒude | some
数学 | shùxué | maths
体育 | tǐyù | PE; sports
美术 | měishù | art
音乐 | yīnyuè | music
电脑 | diànnǎo | computer`;
const EXTRA = ['口','木','氵','讠','亻','女','日','月','心','宀','艹','扌','土','力','又','目','子','十','火','人','辶','囗','大','王'];
const TYPES = {'+':'lr','/':'tb','<':'wl','@':'fs'};
const LABELS = {
  lr:[['左','Left'],['右','Right']], tb:[['上','Top'],['下','Bottom']],
  wl:[['外','Outside'],['里','Inside']], fs:[['外','Outside'],['里','Inside']]
};
const STRUCT = {lr:'左右结构 ⿰ left–right', tb:'上下结构 ⿱ top–bottom', wl:'半包围 ⿺ wrap-around', fs:'全包围 ⿴ enclosed'};

const $ = id => document.getElementById(id);
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parse(text){
  const items=[], bad=[];
  text.split(/\r?\n/).forEach((raw,n)=>{
    const line=raw.trim(); if(!line||line.startsWith('#')) return;
    let m=line.match(/^(\S+)\s*=\s*(\S+?)\s*([+\/<@])\s*(\S+?)\s*(?:\|\s*([^|]*?)\s*)?(?:\|\s*(.*?)\s*)?$/);
    if(m){items.push({kind:'char',ch:m[1],parts:[m[2],m[4]],type:TYPES[m[3]],py:m[5]||'',mean:m[6]||''});return}
    m=line.match(/^([^\s|=]+)\s*(?:\|\s*([^|]*?)\s*)?(?:\|\s*(.*?)\s*)?$/);
    const chars=m?[...m[1]]:[];
    if(m&&chars.length>=2&&chars.length<=4){items.push({kind:'word',ch:m[1],parts:chars,type:'word',py:m[2]||'',mean:m[3]||''});return}
    bad.push(n+1);
  });
  return {items,bad};
}

let LIST=parse(store.get('ca_list_v2')||DEFAULT_LIST).items;
let settings={
  rounds:+(store.get('ca_rounds')??10),
  speak:store.get('ca_speak')!=='0',
  pinyin:store.get('ca_py')!=='0',
  mode:store.get('ca_mode')||'char'
};

let queue=[],idx=0,score=0,streak=0,cur=null,slots=[],tiles=[],hintLevel=0,solved=false,missed=[];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function pool(){
  const p=settings.mode==='mix'?LIST:LIST.filter(x=>x.kind===settings.mode);
  return p.length?p:LIST;
}
function start(){
  document.querySelectorAll('.modebtn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===settings.mode));
  const src=pool(),n=settings.rounds||src.length;
  queue=shuffle(src).slice(0,Math.min(n,src.length));
  idx=0;score=0;streak=0;missed=[];
  $('game').hidden=false;$('endScreen').hidden=true;
  load();
}

const GUIDES=`<svg class="guides" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g stroke="var(--grid)" stroke-width=".7" stroke-dasharray="1.5 2.5" stroke-linecap="round" fill="none"><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></g></svg>`;

function load(){
  cur=queue[idx];hintLevel=0;solved=false;
  slots=cur.parts.map(()=>null);
  const host=$('boardHost');
  if(cur.kind==='char'){
    host.innerHTML=`<div class="board ${cur.type}" id="board">${GUIDES}<div class="slot s0" data-i="0"></div><div class="slot s1" data-i="1"></div><div class="full">${esc(cur.ch)}</div></div>`;
  }else{
    host.innerHTML=`<div class="wordrow" id="board">${cur.parts.map((_,i)=>`<div class="cell">${GUIDES}<div class="slot" data-i="${i}"></div></div>`).join('')}</div>`;
  }
  host.querySelectorAll('.slot').forEach(el=>{
    const remove=()=>{const i=+el.dataset.i;if(solved||!slots[i])return;slots[i].used=false;slots[i]=null;render()};
    el.addEventListener('click',remove);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();remove()}});
  });
  $('pinyin').textContent=settings.pinyin?cur.py:'';
  $('meaning').textContent=cur.mean;
  $('struct').textContent='';
  setMsg(cur.kind==='char'?['点一点部件，拼成一个字吧！','Tap the parts to build the character.']:['点一点汉字，组成一个词吧！','Tap the characters to build the word.'],'');
  $('nextBtn').hidden=true;['hintBtn','clearBtn','skipBtn'].forEach(b=>$(b).disabled=false);

  const size=cur.parts.length+4;
  let others;
  if(cur.kind==='char') others=[...new Set([...LIST.filter(x=>x.kind==='char').flatMap(x=>x.parts),...EXTRA])];
  else others=[...new Set(LIST.flatMap(x=>x.kind==='word'?x.parts:[x.ch]))];
  others=shuffle(others.filter(p=>!cur.parts.includes(p))).slice(0,size-cur.parts.length);
  tiles=shuffle([...cur.parts,...others]).map((p,i)=>({id:i,p,used:false}));
  render();updateStats();
}

function slotLabel(i){
  if(cur.kind==='word')return [String(i+1),''];
  return LABELS[cur.type][i];
}
function render(){
  const firstEmpty=slots.indexOf(null);
  document.querySelectorAll('#board .slot').forEach(el=>{
    const i=+el.dataset.i,t=slots[i],[zh,en]=slotLabel(i);
    el.classList.toggle('empty',!t);
    el.classList.toggle('next',!t&&firstEmpty===i);
    el.innerHTML=t?`<span class="glyph">${esc(t.p)}</span>`:`<span class="ph">${zh}${en?'<br>'+en:''}</span>`;
    el.setAttribute('role','button');el.setAttribute('tabindex',t?'0':'-1');
    el.setAttribute('aria-label',t?`Remove ${t.p}`:`${zh} ${en} empty`);
  });
  const tray=$('tray');tray.innerHTML='';
  const hintPart=hintLevel>=2&&firstEmpty>=0?cur.parts[firstEmpty]:null;
  let hinted=false;
  tiles.forEach(t=>{
    const b=document.createElement('button');
    const isHint=!hinted&&!t.used&&t.p===hintPart; if(isHint)hinted=true;
    b.className='tile'+(t.used?' used':'')+(isHint?' hint':'');
    b.textContent=t.p;b.dataset.id=t.id;b.setAttribute('aria-label',t.p);
    b.addEventListener('pointerdown',e=>dragStart(e,t));
    tray.appendChild(b);
  });
}

function place(t,i){
  if(solved||t.used)return;
  if(i==null)i=slots.indexOf(null);
  if(i<0)return;
  if(slots[i])slots[i].used=false;
  slots[i]=t;t.used=true;render();
  if(slots.every(Boolean))check();
}

function markMissed(){if(!missed.includes(cur))missed.push(cur)}
function check(){
  const got=slots.map(s=>s.p);
  if(got.join('|')===cur.parts.join('|')){
    solved=true;const pts=hintLevel?5:10;score+=pts;streak++;
    $('board').classList.add('solved');confetti();
    setMsg([`对了！${cur.ch} ${cur.py}　+${pts}${streak>=3?`　连对 ${streak} 🔥`:''}`,`Correct!${streak>=3?` ${streak} in a row!`:''}`],'good');
    speak(cur.ch);finishRound();
  }else{
    streak=0;markMissed();
    const sameSet=[...got].sort().join()===[...cur.parts].sort().join();
    setMsg(sameSet
      ?(cur.kind==='char'?['部件对了，位置不对，换一换。','Right parts, wrong positions. Swap them.']:['字对了，顺序不对。','Right characters, wrong order.'])
      :['不对，再试一次。','Not quite. Try again.'],'bad');
    const b=$('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    setTimeout(()=>{if(solved)return;slots.forEach(s=>s&&(s.used=false));slots=slots.map(()=>null);render()},450);
  }
  updateStats();
}

function finishRound(){
  ['hintBtn','clearBtn','skipBtn'].forEach(b=>$(b).disabled=true);
  if(!settings.pinyin)$('pinyin').textContent=cur.py;
  $('nextBtn').hidden=false;$('nextBtn').focus();
  renderDots();
}
function next(){idx++;if(idx>=queue.length)return end();load()}

function end(){
  $('game').hidden=true;$('endScreen').hidden=false;
  $('endScore').textContent=`${score} / ${queue.length*10}`;$('endBun').setAttribute('class','bun '+(missed.length<=queue.length/3?'happy':''));
  $('endText').innerHTML=missed.length
    ?'这些要再练一练 <span class="en">Practise these again:</span>'
    :'全部一次答对，太棒了！<span class="en">All correct on the first try!</span>';
  const sym={lr:'+',tb:'/',wl:'⿺',fs:'⿴'};
  $('review').innerHTML=missed.map(m=>`<div><span class="c">${esc(m.ch)}</span>${m.kind==='char'?esc(m.parts.join(` ${sym[m.type]} `))+'　':''}${esc(m.py)}<br><span class="en">${esc(m.mean)}</span></div>`).join('');
}

function hint(){
  hintLevel++;
  if(hintLevel===1){
    $('struct').textContent=cur.kind==='char'
      ?'提示 Hint：'+STRUCT[cur.type]
      :`提示 Hint：${cur.parts.length} 个字 characters`+(settings.pinyin?'':`　${cur.py}`);
  }else{
    hintLevel=2;$('struct').textContent+='　·　看亮起的格子 See the highlighted tile';render();
  }
}
function skip(){
  streak=0;markMissed();solved=true;
  slots.forEach(s=>s&&(s.used=false));
  slots=cur.parts.map(p=>({p,used:true}));render();
  $('board').classList.add('solved');
  setMsg([`答案：${cur.ch}　${cur.py}`,`Answer: ${cur.ch} — ${cur.mean}`],'bad');
  speak(cur.ch);finishRound();updateStats();
}
function clearSlots(){slots.forEach(s=>s&&(s.used=false));slots=slots.map(()=>null);render()}
function setMsg([zh,en],c){const m=$('msg');m.innerHTML=`${esc(zh)}<span class="en">${esc(en)}</span>`;m.className='bubble '+c;$('bun').setAttribute('class','bun '+(c==='good'?'happy':c==='bad'?'sad':''))}
function updateStats(){
  $('score').textContent=score;$('streak').textContent=streak;
  $('round').textContent=`${Math.min(idx+1,queue.length)}/${queue.length}`;
  renderDots();
}
function renderDots(){
  $('dots').innerHTML=queue.map((q,i)=>`<i class="${i<idx||(i===idx&&solved)?(missed.includes(q)?'miss':'done'):i===idx?'now':''}"></i>`).join('');
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const b=$('board').getBoundingClientRect(),cols=['#FF8FAB','#6FD6B0','#FFD66B','#8EC5FF','#C9A7FF'];
  for(let i=0;i<18;i++){
    const d=document.createElement('span');d.className='bit';
    d.style.left=(b.left+b.width/2)+'px';d.style.top=(b.top+b.height/2)+'px';
    d.style.background=cols[i%cols.length];
    const a=Math.random()*Math.PI*2,r=90+Math.random()*120;
    d.style.setProperty('--x',Math.cos(a)*r+'px');d.style.setProperty('--y',Math.sin(a)*r-40+'px');
    document.body.appendChild(d);setTimeout(()=>d.remove(),900);
  }
}
function speak(t,force){
  if((!settings.speak&&!force)||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}
}

/* click + drag (mouse & touch) */
let drag=null;
function dragStart(e,t){
  if(t.used||solved)return;
  drag={t,x:e.clientX,y:e.clientY,moved:false,ghost:null,el:e.currentTarget};
  e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.addEventListener('pointermove',dragMove);
  e.currentTarget.addEventListener('pointerup',dragEnd,{once:true});
}
function slotAt(x,y){
  const els=document.elementsFromPoint(x,y);
  for(const el of els){const s=el.closest&&el.closest('#board .slot');if(s)return s}
  return null;
}
function dragMove(e){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    drag.moved=true;const g=drag.el.cloneNode(true);
    Object.assign(g.style,{position:'fixed',pointerEvents:'none',zIndex:9,opacity:.9,margin:0});
    document.body.appendChild(g);drag.ghost=g;drag.el.style.opacity=.3;
  }
  if(drag.ghost){
    drag.ghost.style.left=(e.clientX-37)+'px';drag.ghost.style.top=(e.clientY-37)+'px';
    document.querySelectorAll('.slot.drop').forEach(s=>s.classList.remove('drop'));
    const s=slotAt(e.clientX,e.clientY);if(s)s.classList.add('drop');
  }
}
function dragEnd(e){
  e.currentTarget.removeEventListener('pointermove',dragMove);
  if(!drag)return;
  document.querySelectorAll('.slot.drop').forEach(s=>s.classList.remove('drop'));
  if(drag.moved){
    drag.ghost.remove();drag.el.style.opacity='';
    const s=slotAt(e.clientX,e.clientY);if(s)place(drag.t,+s.dataset.i);
  }else place(drag.t);
  drag=null;
}
$('tray').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){const b=e.target.closest('.tile');if(b){e.preventDefault();place(tiles[+b.dataset.id])}}
});

$('hintBtn').onclick=hint;$('clearBtn').onclick=clearSlots;$('skipBtn').onclick=skip;
$('sayBtn').onclick=()=>speak(cur.ch,true);
$('nextBtn').onclick=next;$('againBtn').onclick=start;
document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>{settings.mode=b.dataset.mode;store.set('ca_mode',settings.mode);start()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&solved&&!$('nextBtn').hidden&&document.activeElement!==$('nextBtn')&&!$('editor').open)next()});

/* editor */
$('editBtn').onclick=()=>{
  $('listText').value=store.get('ca_list_v2')||DEFAULT_LIST;
  $('roundsSel').value=String(settings.rounds);$('speakChk').checked=settings.speak;$('pyChk').checked=settings.pinyin;
  $('err').textContent='';$('editor').showModal();
};
$('cancelEdit').onclick=()=>$('editor').close();
$('resetList').onclick=()=>{$('listText').value=DEFAULT_LIST};
$('saveList').onclick=()=>{
  const {items,bad}=parse($('listText').value);
  if(bad.length){$('err').textContent=`第 ${bad.join('、')} 行格式不对 · Line ${bad.join(', ')} has a format error`;return}
  if(!items.length){$('err').textContent='至少需要一项 · Add at least one item';return}
  LIST=items;settings.rounds=+$('roundsSel').value;settings.speak=$('speakChk').checked;settings.pinyin=$('pyChk').checked;
  store.set('ca_list_v2',$('listText').value);store.set('ca_rounds',settings.rounds);
  store.set('ca_speak',settings.speak?'1':'0');store.set('ca_py',settings.pinyin?'1':'0');
  $('editor').close();start();
};

start();
</script>
</body>
